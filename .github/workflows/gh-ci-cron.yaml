name: GH Actions Cron CI
on:
  push:
    branches:
      - main
  schedule:
    # once a week at midnight on Sunday
    - cron: "0 3 * * 0"
  workflow_dispatch:

concurrency:
  # Commits to develop/master will cancel each other, but PRs will only cancel
  # commits within the same PR
  group: "${{ github.ref }}-${{ github.head_ref }}-${{ github.workflow }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  gen_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get-mdakits.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - id: get-mdakits
        run: |
          mdakit=$(find mdakits -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -vx template \
            | jq -Rnc '[inputs]')
          echo "matrix=${mdakit}" >> $GITHUB_OUTPUT

  env_config:
    runs-on: ubuntu-latest
    outputs:
      python-stable: ${{ steps.get-compatible-python.outputs.stable-python }}
      python-min: ${{ steps.get-compatible-python.outputs.oldest-python }}

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - id: get-compatible-python
        uses: MDAnalysis/mdanalysis-compatible-python@main
        with:
          release: "develop"

  mdakit-ci:
    needs: [gen_matrix, env_config]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mdakit: ${{fromJSON(needs.gen_matrix.outputs.matrix)}}
        jobstep: ['latest', 'develop']
    steps:
      - uses: actions/checkout@v6

      - id: get-base-python-deps
        name: get-base-python-deps
        run: |
          pip install requests setuptools packaging pyyaml pydantic

      - id: check-set-python-bounds
        name: check-set-python-bounds
        continue-on-error: false
        run: |
          maxpy=${{needs.env_config.outputs.python-stable}}
          minpy=${{needs.env_config.outputs.python-min}}
          pyver=$(python utils/check_python_ver.py --mdakit "${{matrix.mdakit}}" --maxpyver ${maxpy} --minpyver ${minpy})
          echo "PYVER=${pyver}" >> $GITHUB_ENV
          
      - id: install-conda-env
        name: install-conda-env
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ env.PYVER }}
          add-pip-as-python-dependency: true
          use-mamba: true
          miniforge-version: latest
          channels: conda-forge
          channel-priority: flexible
          auto-update-conda: true
          show-channel-urls: true

      - id: install-conda-base-deps
        name: install-conda-base-deps
        run: |
          mamba install requests setuptools packaging pyyaml pydantic

      - id: install-mdakit
        name: install-mdakit
        continue-on-error: true
        run: |
         if [[ ${{ matrix.jobstep }} == "develop" ]]; then
           type="src"
         else
           type="install"
         fi

         install=$(python utils/get_install.py --itype ${type} --mdakit ${{matrix.mdakit}})
         echo "install=${install}"
         eval ${install}

      - id: install-test-deps
        name: install-test-deps
        continue-on-error: true
        run: |
          install=$(python utils/get_testdeps.py --mdakit ${{matrix.mdakit}})
          echo "install tests:${install}"
          eval ${install}

      - id: install-mdanalysis
        name: install-mdanalysis
        uses: MDAnalysis/install-mdanalysis@main
        continue-on-error: true
        with:
          version: ${{ matrix.jobstep }}
          install-tests: true
          installer: mamba
          shell: bash -l {0}

      - id: run-tests
        name: run-tests
        continue-on-error: true
        run: |
          tests=$(python utils/get_runtests.py --mdakit ${{matrix.mdakit}} --runtype ${{matrix.jobstep}})
          echo "tests: ${tests}"
          eval ${tests}

      - id: write-errors
        name: write-errors
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          jq '{
            install_python: ."check-set-python-bounds".outcome,
            install_mdakit: ."install-mdakit".outcome,
            install_test_deps: ."install-test-deps".outcome,
            install_mdanalysis: ."install-mdanalysis".outcome,
            run_tests: ."run-tests".outcome
          }' <<< "${STEPS}" > ${{ matrix.mdakit }}-${{ matrix.jobstep }}-statuses.json

      - id: upload-artifacts
        name: upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cron-statuses-${{ matrix.mdakit }}-${{ matrix.jobstep }}
          path: ${{ matrix.mdakit }}-${{ matrix.jobstep }}-statuses.json
          retention-days: 1
          if-no-files-found: error
 
  process_results:
    if: ${{ always() }}
    needs: mdakit-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write 
      packages: none
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: json-statuses/

      - name: list-temp-files
        run: ls -l json-statuses/*/

      - id: get-base-python-deps
        name: get-base-python-deps
        run: |
          pip install requests setuptools packaging pyyaml pydantic

      - id: summarise-results
        name: summarise-results
        run: |
          {
            echo "| MDAKit | Run | Install Python | Install MDAKit | Install test deps | Install MDAnalysis | Run tests |"
            echo "|---|---|---|---|---|---|---|"
            for f in json-statuses/*/*-statuses.json; do
              kit_run=$(basename "$f" -statuses.json)
              jq -r --arg kit "${kit_run%-*}" --arg run "${kit_run##*-}" \
                '[$kit, $run, .install_python, .install_mdakit, .install_test_deps, .install_mdanalysis, .run_tests]
                 | map(if . == "success" then "✅" elif . == "failure" then "❌" else . end)
                 | "| " + join(" | ") + " |"' "$f"
            done
          } >> $GITHUB_STEP_SUMMARY

      - id: combine-write-statuses
        name: combine-write-statuses
        run: |
          python utils/handle-status.py

      - id: raise-issues
        name: raise-issues
        run: |
          .github/scripts/ci-issues.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: commit changes to status files
          skip_dirty_check: false
          skip_fetch: false

  deploy_docs:
    if: ${{ always() }}
    needs: process_results
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: setup_micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: docs/requirements.yaml
          environment-name: MDAKitRegistry-docs
          create-args: >-
            python=3.12
            pip
      - name: build_docs
        run: |
          cd docs && sphinx-build -b html source build
      - name: upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/build
      - id: deployment
        name: deploy docs
        uses: actions/deploy-pages@v5
