# readthedocs.yaml

version: 2

sphinx:
  configuration: docs/source/conf.py

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # the docs environment is managed by pixi (see pixi.toml)
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      - pixi install --locked -e docs
    build:
      html:
        - pixi run --locked -e docs sphinx-build -T -b html docs/source $READTHEDOCS_OUTPUT/html
